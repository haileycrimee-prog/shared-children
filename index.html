<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="《共享儿女》是一次关于信任、服务边界和稳定陪伴的沉浸式新闻体验。"
    />
    <meta name="theme-color" content="#f6ebdd" />
    <title>共享儿女｜一次关于信任的服务体验</title>
    <style>
:root {
  --bg-main: #f6ebdd;
  --bg-deep: #e8d3b8;
  --bg-card: #fff8ef;
  --primary: #d99a4a;
  --primary-dark: #a9692f;
  --primary-light: #f2c27b;
  --text-main: #3d332b;
  --text-secondary: #776b61;
  --border: #e5c9a5;
  --news-blue: #55789a;
  --news-blue-soft: #eaf0f4;
  --warning: #c94c3d;
  --warning-soft: #f8e9e5;
  --success: #718b6a;
  --success-soft: #edf2e9;
  --white: #ffffff;
  --shadow: 0 16px 42px rgba(91, 62, 36, 0.13);
  --shadow-soft: 0 8px 24px rgba(91, 62, 36, 0.09);
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC",
    "Microsoft YaHei", sans-serif;
  --serif: "Songti SC", "STSong", "SimSun", serif;
  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --content-width: 430px;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: #dbc3a5;
  color-scheme: light;
}

body {
  min-width: 320px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 18% 4%, rgba(255, 248, 239, 0.98), transparent 32rem),
    linear-gradient(145deg, #e8d6be 0%, #d8bea0 50%, #c9ad8c 100%);
  color: var(--text-main);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.68;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  font: inherit;
}

button:focus-visible,
a:focus-visible,
[tabindex="-1"]:focus-visible {
  outline: 3px solid var(--news-blue);
  outline-offset: 4px;
}

[hidden] {
  display: none !important;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.ambient {
  position: fixed;
  z-index: 0;
  width: 30rem;
  height: 30rem;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(2px);
  opacity: 0.45;
}

.ambient--one {
  top: -14rem;
  left: -13rem;
  background: radial-gradient(circle, rgba(255, 250, 242, 0.95), transparent 68%);
}

.ambient--two {
  right: -16rem;
  bottom: -13rem;
  background: radial-gradient(circle, rgba(185, 123, 60, 0.25), transparent 70%);
}

.app-shell {
  position: relative;
  z-index: 1;
  width: min(100%, var(--content-width));
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  padding-bottom: max(18px, env(safe-area-inset-bottom));
  overflow: hidden;
  background:
    linear-gradient(90deg, rgba(113, 74, 39, 0.035) 1px, transparent 1px) 0 0 / 19px 19px,
    linear-gradient(rgba(113, 74, 39, 0.025) 1px, transparent 1px) 0 0 / 19px 19px,
    var(--bg-main);
  box-shadow: 0 0 0 1px rgba(95, 64, 38, 0.08), 0 30px 80px rgba(70, 45, 24, 0.18);
}

.app-shell::before {
  position: fixed;
  z-index: 10;
  top: 0;
  bottom: 0;
  width: min(100%, var(--content-width));
  pointer-events: none;
  content: "";
  opacity: 0.28;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
  mix-blend-mode: multiply;
}

.topbar {
  position: sticky;
  z-index: 20;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 58px;
  padding:
    max(10px, env(safe-area-inset-top))
    20px
    10px;
  border-bottom: 1px solid rgba(193, 158, 119, 0.38);
  background: rgba(246, 235, 221, 0.92);
  backdrop-filter: blur(14px);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-main);
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-decoration: none;
}

.brand-mark {
  position: relative;
  width: 21px;
  height: 18px;
  border: 1.7px solid var(--primary-dark);
  border-top: 0;
  border-radius: 0 0 11px 11px;
}

.brand-mark::before,
.brand-mark::after {
  position: absolute;
  top: -5px;
  width: 11px;
  height: 11px;
  border: 1.7px solid var(--primary-dark);
  border-radius: 50%;
  content: "";
  background: var(--bg-main);
}

.brand-mark::before {
  left: -5px;
}

.brand-mark::after {
  right: -5px;
}

.progress-wrap {
  display: flex;
  align-items: center;
  gap: 9px;
}

.progress-label {
  color: var(--text-secondary);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  font-weight: 650;
}

.progress-track {
  width: 84px;
  height: 5px;
  overflow: hidden;
  border-radius: 999px;
  background: #decaae;
}

.progress-fill {
  display: block;
  width: 20%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--primary-dark), var(--primary-light));
  transition: width 420ms ease;
}

.game-root {
  position: relative;
  z-index: 1;
  min-height: calc(100vh - 58px);
  min-height: calc(100dvh - 58px);
}

.scene-page {
  display: flex;
  min-height: calc(100vh - 58px);
  min-height: calc(100dvh - 58px);
  flex-direction: column;
  padding: 18px 18px 22px;
  animation: page-in 420ms ease both;
}

.scene-page--opening {
  min-height: 100vh;
  min-height: 100dvh;
  justify-content: flex-end;
  padding-top: max(28px, env(safe-area-inset-top));
}

.scene-main {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 16px;
}

.scene-kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  color: var(--primary-dark);
  font-size: 13px;
  font-weight: 750;
  letter-spacing: 0.1em;
}

.scene-kicker::before {
  width: 18px;
  height: 2px;
  border-radius: 2px;
  content: "";
  background: var(--primary);
}

.scene-title,
.opening-title {
  margin: 0;
  color: var(--text-main);
  font-family: var(--serif);
  font-weight: 800;
  letter-spacing: 0.03em;
  line-height: 1.14;
}

.scene-title {
  font-size: clamp(28px, 8.2vw, 36px);
}

.opening-title {
  font-size: clamp(48px, 15vw, 64px);
  letter-spacing: 0.07em;
}

.opening-subtitle {
  margin: 6px 0 0;
  color: var(--text-secondary);
  font-family: var(--serif);
  font-size: 18px;
  letter-spacing: 0.05em;
}

.lede {
  margin: 0;
  color: var(--text-main);
  font-size: 16px;
  line-height: 1.82;
}

.lede--muted {
  color: var(--text-secondary);
}

.opening-heading {
  padding: 4px 4px 0;
}

.opening-heading::after {
  display: block;
  width: 54px;
  height: 3px;
  margin-top: 16px;
  border-radius: 999px;
  content: "";
  background: var(--primary);
}

.scene-art {
  position: relative;
  width: 100%;
  margin: 0;
  overflow: hidden;
  border: 1px solid rgba(148, 105, 65, 0.18);
  border-radius: var(--radius-xl);
  background: #dfc9ad;
  box-shadow: var(--shadow);
  isolation: isolate;
}

.scene-art::after {
  position: absolute;
  inset: 0;
  pointer-events: none;
  content: "";
  background:
    linear-gradient(180deg, transparent 64%, rgba(61, 46, 32, 0.16)),
    radial-gradient(circle at 85% 8%, rgba(255, 249, 235, 0.22), transparent 28%);
}

.scene-art img {
  display: block;
  width: 100%;
  height: 100%;
  aspect-ratio: 4 / 3.45;
  object-fit: cover;
}

.scene-art--opening {
  flex: 1;
  min-height: 280px;
  max-height: 43vh;
}

.scene-art--opening img {
  min-height: 280px;
}

.scene-art--wide img {
  aspect-ratio: 4 / 2.8;
}

.art-caption {
  position: absolute;
  z-index: 2;
  right: 14px;
  bottom: 12px;
  padding: 4px 9px;
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 999px;
  color: rgba(255, 255, 255, 0.9);
  background: rgba(55, 43, 31, 0.32);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.05em;
  backdrop-filter: blur(8px);
}

.opening-copy {
  display: grid;
  gap: 12px;
  padding: 2px 4px;
}

.opening-copy p {
  margin: 0;
  color: var(--text-main);
  font-size: 15px;
  line-height: 1.78;
}

.opening-copy .question {
  padding-top: 3px;
  color: var(--primary-dark);
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 700;
}

.card {
  border: 1px solid rgba(199, 158, 112, 0.48);
  border-radius: var(--radius-lg);
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.78), rgba(255, 248, 239, 0.92)),
    var(--bg-card);
  box-shadow: var(--shadow-soft);
}

.service-card {
  padding: 16px 17px;
}

.service-card__top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 13px;
  border-bottom: 1px dashed var(--border);
}

.service-card__eyebrow,
.news-card__eyebrow {
  margin: 0 0 3px;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.service-card__name {
  margin: 0;
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 800;
}

.service-card__tag {
  flex: 0 0 auto;
  padding: 4px 9px;
  border-radius: 999px;
  color: var(--success);
  background: var(--success-soft);
  font-size: 12px;
  font-weight: 700;
}

.service-card__details {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 16px;
  margin: 13px 0 0;
}

.service-card__details div {
  min-width: 0;
}

.service-card__details dt {
  color: var(--text-secondary);
  font-size: 11px;
  letter-spacing: 0.05em;
}

.service-card__details dd {
  margin: 1px 0 0;
  font-size: 14px;
  font-weight: 650;
  line-height: 1.5;
}

.dialogue {
  position: relative;
  padding: 18px 19px;
  border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg);
  color: var(--text-main);
  background: var(--white);
  box-shadow: var(--shadow-soft);
}

.dialogue::before {
  position: absolute;
  top: -8px;
  left: 17px;
  width: 16px;
  height: 16px;
  content: "";
  transform: rotate(45deg);
  background: var(--white);
}

.dialogue__speaker {
  margin: 0 0 4px;
  color: var(--primary-dark);
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.08em;
}

.dialogue__line {
  margin: 0;
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 650;
  line-height: 1.65;
}

.dialogue__line + .dialogue__line {
  margin-top: 4px;
}

.prompt {
  margin: 2px 2px 0;
  font-size: 16px;
  font-weight: 750;
}

.choice-list {
  display: grid;
  gap: 10px;
  margin-top: auto;
  padding-top: 4px;
}

.choice-button,
.primary-button,
.secondary-button {
  width: 100%;
  min-height: 54px;
  border: 0;
  border-radius: 28px;
  cursor: pointer;
  font-size: 16px;
  font-weight: 750;
  line-height: 1.4;
  transition:
    transform 150ms ease,
    background-color 150ms ease,
    box-shadow 150ms ease;
}

.choice-button {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 17px 11px 12px;
  border: 1px solid var(--border);
  color: var(--text-main);
  text-align: left;
  background: var(--bg-card);
  box-shadow: 0 5px 14px rgba(79, 53, 31, 0.07);
}

.choice-key {
  display: grid;
  width: 31px;
  height: 31px;
  flex: 0 0 31px;
  place-items: center;
  border-radius: 50%;
  color: var(--primary-dark);
  background: #f5ddbd;
  font-size: 13px;
  font-weight: 800;
}

.primary-button {
  padding: 14px 22px;
  color: #4a321c;
  background: linear-gradient(135deg, var(--primary-light), #eba651);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.55),
    0 9px 20px rgba(173, 108, 42, 0.22);
}

.secondary-button {
  padding: 13px 22px;
  border: 1px solid var(--border);
  color: var(--text-main);
  background: rgba(255, 248, 239, 0.76);
}

.choice-button:hover,
.primary-button:hover {
  transform: translateY(-1px);
}

.choice-button:active,
.primary-button:active,
.secondary-button:active {
  transform: scale(0.985);
}

.action-row {
  display: grid;
  gap: 10px;
  margin-top: auto;
  padding-top: 8px;
}

.scene-footer-note {
  margin: 0;
  padding: 1px 4px 0;
  color: var(--text-secondary);
  font-size: 12px;
  line-height: 1.55;
  text-align: center;
}

.trust-panel {
  display: grid;
  gap: 12px;
  padding: 15px 16px;
}

.trust-row {
  display: grid;
  grid-template-columns: minmax(76px, auto) 1fr;
  align-items: center;
  gap: 10px;
}

.trust-label {
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 650;
}

.trust-value {
  display: flex;
  min-width: 0;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
}

.trust-stars {
  color: var(--primary);
  font-family: system-ui, sans-serif;
  font-size: 17px;
  letter-spacing: 0.08em;
  line-height: 1;
  white-space: nowrap;
}

.trust-change {
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.status-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 15px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 700;
}

.status-strip__label {
  color: var(--text-secondary);
  font-weight: 600;
}

.status-strip--warning {
  color: var(--warning);
  background: var(--warning-soft);
}

.status-strip--success {
  color: var(--success);
  background: var(--success-soft);
}

.status-strip--neutral {
  color: var(--text-main);
  background: #f3eadc;
}

.news-card {
  position: relative;
  overflow: hidden;
  padding: 17px 18px 18px;
  border: 1px solid rgba(85, 120, 154, 0.22);
  border-radius: var(--radius-lg);
  background:
    linear-gradient(155deg, rgba(255, 255, 255, 0.78), transparent 52%),
    var(--news-blue-soft);
}

.news-card::before {
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  content: "";
  background: var(--news-blue);
}

.news-card__eyebrow {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--news-blue);
}

.news-card__eyebrow::before {
  display: inline-grid;
  width: 34px;
  height: 17px;
  place-items: center;
  border-radius: 3px;
  color: var(--white);
  content: "NEWS";
  font-size: 8px;
  font-weight: 850;
  letter-spacing: 0.08em;
  background: var(--news-blue);
}

.news-card__title {
  margin: 5px 0 6px;
  color: #2f465a;
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 800;
  line-height: 1.35;
}

.news-card__body {
  margin: 0;
  color: #526678;
  font-size: 14px;
  line-height: 1.72;
}

.notice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 13px 14px;
  border-radius: var(--radius-md);
  color: #5d492e;
  background: #f3e2c9;
  font-size: 14px;
  font-weight: 650;
  line-height: 1.6;
}

.notice::before {
  display: grid;
  width: 22px;
  height: 22px;
  flex: 0 0 22px;
  place-items: center;
  margin-top: 1px;
  border-radius: 50%;
  color: white;
  content: "i";
  background: var(--primary);
  font-family: Georgia, serif;
  font-size: 13px;
  font-weight: 800;
}

.day-marker {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  align-self: flex-start;
  padding: 5px 11px 5px 7px;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--primary-dark);
  background: rgba(255, 248, 239, 0.78);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.06em;
}

.day-marker span {
  display: grid;
  width: 26px;
  height: 26px;
  place-items: center;
  border-radius: 50%;
  color: white;
  background: var(--primary);
  font-size: 11px;
}

.message-stack {
  display: grid;
  gap: 9px;
}

.chat-line {
  width: fit-content;
  max-width: 90%;
  margin: 0;
  padding: 11px 14px;
  border-radius: 5px 16px 16px 16px;
  color: var(--text-main);
  background: var(--white);
  box-shadow: var(--shadow-soft);
  font-size: 15px;
  line-height: 1.6;
}

.chat-line--player {
  justify-self: end;
  border-radius: 16px 5px 16px 16px;
  color: #584222;
  background: #f3dcb9;
}

.handoff {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  padding: 17px;
}

.handoff-person {
  display: grid;
  justify-items: center;
  gap: 6px;
  font-size: 14px;
  font-weight: 700;
}

.avatar {
  position: relative;
  width: 51px;
  height: 51px;
  overflow: hidden;
  border: 2px solid rgba(255, 255, 255, 0.8);
  border-radius: 50%;
  background: linear-gradient(150deg, #d7b188, #986e4c);
  box-shadow: var(--shadow-soft);
}

.avatar::before {
  position: absolute;
  top: 10px;
  left: 50%;
  width: 19px;
  height: 21px;
  border-radius: 46% 46% 42% 42%;
  content: "";
  transform: translateX(-50%);
  background: #f2d3b8;
}

.avatar::after {
  position: absolute;
  right: 7px;
  bottom: -13px;
  left: 7px;
  height: 31px;
  border-radius: 20px 20px 0 0;
  content: "";
  background: #4f5a50;
}

.avatar--new::after {
  background: #5c6e82;
}

.handoff-arrow {
  color: var(--primary-dark);
  font-size: 23px;
  font-weight: 800;
}

.handoff-person small {
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
}

.ending-intro {
  text-align: center;
}

.ending-intro .scene-kicker {
  justify-content: center;
}

.ending-intro .scene-title {
  margin-top: 2px;
}

.ending-intro .lede {
  margin-top: 10px;
  color: var(--text-secondary);
}

.issues {
  display: grid;
  gap: 9px;
}

.issue {
  display: grid;
  grid-template-columns: 44px 1fr;
  align-items: start;
  gap: 12px;
  padding: 14px;
}

.issue__number {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  border-radius: 50%;
  color: var(--primary-dark);
  background: #f3dcba;
  font-family: Georgia, serif;
  font-size: 18px;
  font-weight: 800;
}

.issue h3 {
  margin: 0 0 2px;
  font-family: var(--serif);
  font-size: 18px;
}

.issue p {
  margin: 0;
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.62;
}

.expert {
  padding: 17px;
  border-left: 3px solid var(--primary);
  background: rgba(255, 248, 239, 0.72);
}

.expert h3 {
  margin: 0 0 7px;
  font-family: var(--serif);
  font-size: 20px;
}

.expert p {
  margin: 0;
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.72;
}

.ending-actions {
  display: grid;
  gap: 10px;
}

.inline-feedback {
  min-height: 24px;
  margin: 0;
  color: var(--warning);
  font-size: 13px;
  line-height: 1.55;
  text-align: center;
}

.noscript {
  position: fixed;
  z-index: 100;
  right: 18px;
  bottom: 18px;
  left: 18px;
  max-width: 390px;
  margin: auto;
  padding: 18px;
  border: 1px solid var(--warning);
  border-radius: 16px;
  color: var(--warning);
  background: var(--warning-soft);
  text-align: center;
}

@keyframes page-in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (min-width: 520px) {
  body {
    padding: 24px 18px;
  }

  .app-shell {
    min-height: calc(100vh - 48px);
    min-height: calc(100dvh - 48px);
    border-radius: 30px;
  }

  .app-shell::before {
    border-radius: 30px;
  }

  .topbar {
    border-radius: 30px 30px 0 0;
  }
}

@media (max-width: 360px) {
  body {
    font-size: 15px;
  }

  .scene-page {
    padding: 14px 14px 18px;
  }

  .topbar {
    padding-right: 15px;
    padding-left: 15px;
  }

  .scene-main {
    gap: 13px;
  }

  .scene-title {
    font-size: 28px;
  }

  .opening-title {
    font-size: 48px;
  }

  .service-card__details {
    grid-template-columns: 1fr;
    gap: 7px;
  }

  .trust-row {
    grid-template-columns: 1fr;
    gap: 3px;
  }

  .trust-value {
    justify-content: flex-start;
  }

  .choice-button {
    padding-right: 13px;
    font-size: 15px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

function stars(value) {
  const safeValue = Math.max(0, Math.min(5, Number(value) || 0));
  return "★".repeat(safeValue) + "☆".repeat(5 - safeValue);
}

function art(src, alt, options = {}) {
  const classes = ["scene-art"];
  if (options.opening) classes.push("scene-art--opening");
  if (options.wide) classes.push("scene-art--wide");
  const imageSource = src.startsWith("data:") ? src : `./assets/images/${src}`;

  return `
    <figure class="${classes.join(" ")}">
      <img src="${imageSource}" alt="${alt}" />
      <figcaption class="art-caption">${options.caption || "场景示意"}</figcaption>
    </figure>
  `;
}

function dialogue(speaker, lines) {
  const lineHtml = lines.map((line) => `<p class="dialogue__line">${line}</p>`).join("");
  return `
    <div class="dialogue">

      ${lineHtml}
    </div>
  `;
}

  return `

        .map(
          ({ key, label, choice }) => `

              class="choice-button"
              type="button"
              data-action="first-visit-choice"
              data-choice="${choice}"
              aria-label="${key}，${label}"
            >
              <span class="choice-key" aria-hidden="true">${key}</span>
              <span>${label}</span>
            </button>

        )

}

}

function trustRow(label, value, transition) {
  const change =
    transition && transition.from !== transition.to

  return `
    <div class="trust-row">

      <span class="trust-value">
        <span class="trust-stars" aria-hidden="true">${stars(value)}</span>
        <span class="sr-only">${value} 星，共 5 星</span>
        ${change}
      </span>
    </div>
  `;
}

function renderGiftAccepted() {
  return pageShell(
    "",
    `
      <div>
        <p class="scene-kicker">场景 03 · 关系越过界线</p>
        <h2 class="scene-title" tabindex="-1">三天后</h2>
      </div>
      ${dialogue("王奶奶", ["这就对了嘛。"])}

      <div class="message-stack" aria-label="王女士发来的消息">

        <p class="chat-line">我知道你对他们不错，但你已经超出了正常的服务关系。</p>

      <div class="action-row">${primaryButton("gift-next", "继续")}</div>

  );
}

        "老人住宅窗边留着一把空椅子，晨光照进屋内，像在等待下一次有人来访。",
        { wide: true, caption: "王奶奶家" },
      )}
      ${trustPanel({ elder: 1, family: gameState.familyTrust })}
      ${statusStrip(
        gameState.serviceActive ? "✓ 已有后续服务安排" : "× 原服务已终止",
        gameState.serviceActive ? "success" : "warning",
      )}
      <section class="issues" aria-labelledby="issues-title">
        <h2 class="scene-title" id="issues-title">你刚刚遇到</h2>
        <article class="card issue">
          <span class="issue__number" aria-hidden="true">01</span>
          <div>
            <h3>信任难建立</h3>

          <span class="issue__number" aria-hidden="true">02</span>

            <h3>服务边界模糊</h3>

          <span class="issue__number" aria-hidden="true">03</span>

      ])}
      <section class="card expert">
        <h3>共享儿女，如何走得更远？</h3>
        <p>
          专家建议：明确服务中的法律关系和权责边界；加强养老服务人才队伍建设；建立更加统一的行业服务规范。
        </p>
      </section>
      <div class="ending-actions">
        <button class="primary-button" type="button" data-action="read-article">
          继续阅读现实案例 →
        </button>
        <button class="secondary-button" type="button" data-action="restart-game">重新体验</button>
        <p class="inline-feedback" id="news-feedback" role="status"></p>

function renderScene() {
  let content;

  switch (gameState.scene) {
    case "opening":
      content = renderOpening();
      break;
    case "firstVisit":
      content = renderFirstVisit();
      break;
    case "visitFailedPlatform":
      content = renderVisitFailure("platform");
      break;
    case "visitFailedCare":
      content = renderVisitFailure("care");
      break;
    case "trustDay3":
      content = renderTrustDay3();
      break;
    case "trustDay7":
      content = renderTrustDay7();
      break;
    case "trustDay12":
      content = renderTrustDay12();
      break;
    case "gift":
      content = renderGift();
      break;
    case "giftAccepted":
      content = renderGiftAccepted();
      break;
    case "giftRejected":
      content = renderGiftRejected();
      break;
    case "giftConsulted":
      content = renderGiftConsulted();
      break;
    case "replacementAccepted":
      content = renderReplacement("Accepted");
      break;
    case "replacementRejected":
      content = renderReplacement("Rejected");
      break;
    case "replacementConsulted":
      content = renderReplacement("Consulted");
      break;
    case "endingAccepted":
      content = renderEnding("Accepted");
      break;
    case "endingRejected":
      content = renderEnding("Rejected");
      break;
    case "endingConsulted":
      content = renderEnding("Consulted");
      break;
    default:
      content = renderOpening();
  }

  root.innerHTML = content;
  updateHeader();
  moveFocus();
  announce(SCENE_ANNOUNCEMENTS[gameState.scene] || "");
}

function updateHeader() {
  const progress = SCENE_PROGRESS[gameState.scene];
  if (progress === null || progress === undefined) {
    header.hidden = true;
    return;
  }

  header.hidden = false;
  progressLabel.textContent = `${progress}/5`;
  progressTrack.setAttribute("aria-valuenow", String(progress));
  progressFill.style.width = `${progress * 20}%`;
}

function moveFocus() {
  window.requestAnimationFrame(() => {
    const heading = root.querySelector("h1, h2");
    if (heading) heading.focus({ preventScroll: true });

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  });
}

function announce(message) {
  liveRegion.textContent = "";
  window.setTimeout(() => {
    liveRegion.textContent = message;
  }, 40);
}

function setScene(scene) {
  gameState.scene = scene;
  renderScene();
}

function handleFirstVisitChoice(choice) {
  if (choice === "friend") {
    gameState.elderTrust = 3;
    gameState.serviceActive = true;
    setScene("trustDay3");
    return;
  }

  gameState.elderTrust = 1;
  gameState.serviceActive = false;
  setScene(choice === "platform" ? "visitFailedPlatform" : "visitFailedCare");
}

function handleGiftChoice(choice) {
  if (choice === "accept") {
    gameState.elderTrust = 5;
    gameState.familyTrust = 0;
    gameState.acceptedGift = true;
    gameState.serviceActive = false;
    setScene("giftAccepted");
    return;
  }

  if (choice === "reject") {
    gameState.elderTrust = 3;
    gameState.familyTrust = 4;
    gameState.acceptedGift = false;
    gameState.serviceActive = true;
    setScene("giftRejected");
    return;
  }

  gameState.elderTrust = 4;
  gameState.familyTrust = 4;
  gameState.acceptedGift = false;
  gameState.serviceActive = true;
  setScene("giftConsulted");
}

function handleGiftNext() {
  const currentScene = gameState.scene;
  gameState.elderTrust = 1;

  if (currentScene === "giftAccepted") {
    setScene("replacementAccepted");
  } else if (currentScene === "giftRejected") {
    setScene("replacementRejected");
  } else {
    setScene("replacementConsulted");
  }
}

function handleReplacementNext() {
  const replacementScene = gameState.scene;
  if (replacementScene === "replacementAccepted") {
    setScene("endingAccepted");
  } else if (replacementScene === "replacementRejected") {
    setScene("endingRejected");
  } else {
    setScene("endingConsulted");
  }
}

function resetGame() {
  Object.assign(gameState, INITIAL_STATE);
  setScene("opening");
}

function isNewsUrlConfigured() {
  const value = GAME_CONFIG.NEWS_URL.trim();
  if (!value || value === "YOUR_H5_ARTICLE_URL") return false;

  try {
    const url = new URL(value, window.location.href);
    return url.protocol === "http:" || url.protocol === "https:";
  } catch {
    return false;
  }
}

function handleNewsLink() {
  const feedback = document.querySelector("#news-feedback");

  if (!isNewsUrlConfigured()) {
    if (feedback) {
      feedback.textContent = "新闻正文地址尚未配置。请在 script.js 的 GAME_CONFIG.NEWS_URL 中填写。";
    }
    return;
  }

  window.location.assign(new URL(GAME_CONFIG.NEWS_URL, window.location.href).href);
}

root.addEventListener("click", (event) => {
  const button = event.target.closest("[data-action]");
  if (!button) return;

  const { action, choice } = button.dataset;

  switch (action) {
    case "start-game":
      setScene("firstVisit");
      break;
    case "first-visit-choice":
      handleFirstVisitChoice(choice);
      break;
    case "retry-first-visit":
      gameState.elderTrust = 0;
      gameState.serviceActive = true;
      setScene("firstVisit");
      break;
    case "trust-next-day3":
      setScene("trustDay7");
      break;
    case "trust-next-day7":
      gameState.elderTrust = 5;
      setScene("trustDay12");
      break;
    case "trust-next-day12":
      setScene("gift");
      break;
    case "gift-choice":
      handleGiftChoice(choice);
      break;
    case "gift-next":
      handleGiftNext();
      break;
    case "replacement-next":
      handleReplacementNext();
      break;
    case "restart-game":
      resetGame();
      break;
    case "read-article":
      handleNewsLink();
      break;
    default:
      break;
  }
});

renderScene();

    </script>
  </body>
</html>
